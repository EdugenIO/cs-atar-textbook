<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1450"><title>Ten-table workshop booking interpretation model</title><desc>Venue has zero or many Room rows; every Room row belongs to exactly one Venue. Room has zero or many Session rows; every Session row belongs to exactly one Room. Workshop has zero or many Session rows; every Session row belongs to exactly one Workshop. Instructor has zero or many Session rows; every Session row belongs to exactly one Instructor. Session has zero or many Booking rows; every Booking row belongs to exactly one Session. Member has zero or many Booking rows; every Booking row belongs to exactly one Member. Session has zero or many SessionEquipment rows; every SessionEquipment row belongs to exactly one Session. Equipment has zero or many SessionEquipment rows; every SessionEquipment row belongs to exactly one Equipment. Booking has zero or one Attendance rows; every Attendance row belongs to exactly one Booking. Attendance uses a joint foreign key to Booking. Booking and SessionEquipment each use a composite primary key.</desc><rect width="1250" height="1450" fill="#fcfbf7"/><g font-family="Arial,sans-serif" fill="#18322d"><text x="40" y="46" font-size="30" >Ten tables: workshops, locations and equipment</text><text x="40" y="76" font-size="20" >PK = primary key; FK = foreign key; pair = one composite key</text><g data-entity="Venue"><rect x="40" y="100" width="280" height="160" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M48 100H312Q320 100 320 108V144H40V108Q40 100 48 100" fill="#285747"/><text x="56" y="130" font-size="24" fill="white" font-weight="bold">Venue</text><text x="56" y="176" font-size="20" >PK VenueID</text><text x="56" y="205" font-size="20" >VenueName</text></g><g data-entity="Room"><rect x="40" y="390" width="280" height="180" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M48 390H312Q320 390 320 398V434H40V398Q40 390 48 390" fill="#285747"/><text x="56" y="420" font-size="24" fill="white" font-weight="bold">Room</text><text x="56" y="466" font-size="20" >PK RoomID</text><text x="56" y="495" font-size="20" >FK VenueID</text><text x="56" y="524" font-size="20" >RoomLabel, Capacity</text></g><g data-entity="Workshop"><rect x="440" y="100" width="280" height="160" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M448 100H712Q720 100 720 108V144H440V108Q440 100 448 100" fill="#285747"/><text x="456" y="130" font-size="24" fill="white" font-weight="bold">Workshop</text><text x="456" y="176" font-size="20" >PK WorkshopID</text><text x="456" y="205" font-size="20" >Title</text></g><g data-entity="Instructor"><rect x="840" y="100" width="280" height="160" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M848 100H1112Q1120 100 1120 108V144H840V108Q840 100 848 100" fill="#285747"/><text x="856" y="130" font-size="24" fill="white" font-weight="bold">Instructor</text><text x="856" y="176" font-size="20" >PK InstructorID</text><text x="856" y="205" font-size="20" >DisplayName</text></g><g data-entity="Session"><rect x="440" y="390" width="280" height="220" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M448 390H712Q720 390 720 398V434H440V398Q440 390 448 390" fill="#285747"/><text x="456" y="420" font-size="24" fill="white" font-weight="bold">Session</text><text x="456" y="466" font-size="20" >PK SessionID</text><text x="456" y="495" font-size="20" >FK WorkshopID, RoomID</text><text x="456" y="524" font-size="20" >FK InstructorID</text><text x="456" y="553" font-size="20" >SessionDate, Capacity</text></g><g data-entity="Booking"><rect x="840" y="390" width="280" height="190" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M848 390H1112Q1120 390 1120 398V434H840V398Q840 390 848 390" fill="#285747"/><text x="856" y="420" font-size="24" fill="white" font-weight="bold">Booking</text><text x="856" y="466" font-size="20" >PK/FK pair:</text><text x="856" y="495" font-size="20" >MemberID, SessionID</text><text x="856" y="524" font-size="20" >BookedOn</text></g><g data-entity="Equipment"><rect x="40" y="790" width="280" height="160" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M48 790H312Q320 790 320 798V834H40V798Q40 790 48 790" fill="#285747"/><text x="56" y="820" font-size="24" fill="white" font-weight="bold">Equipment</text><text x="56" y="866" font-size="20" >PK EquipmentID</text><text x="56" y="895" font-size="20" >ItemName, StockQuantity</text></g><g data-entity="SessionEquipment"><rect x="440" y="790" width="280" height="190" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M448 790H712Q720 790 720 798V834H440V798Q440 790 448 790" fill="#285747"/><text x="456" y="820" font-size="24" fill="white" font-weight="bold">SessionEquipment</text><text x="456" y="866" font-size="20" >PK/FK pair:</text><text x="456" y="895" font-size="20" >SessionID, EquipmentID</text><text x="456" y="924" font-size="20" >QuantityUsed</text></g><g data-entity="Member"><rect x="840" y="790" width="280" height="160" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M848 790H1112Q1120 790 1120 798V834H840V798Q840 790 848 790" fill="#285747"/><text x="856" y="820" font-size="24" fill="white" font-weight="bold">Member</text><text x="856" y="866" font-size="20" >PK MemberID</text><text x="856" y="895" font-size="20" >DisplayName</text></g><g data-entity="Attendance"><rect x="840" y="1070" width="280" height="190" rx="8" fill="white" stroke="#285747" stroke-width="2"/><path d="M848 1070H1112Q1120 1070 1120 1078V1114H840V1078Q840 1070 848 1070" fill="#285747"/><text x="856" y="1100" font-size="24" fill="white" font-weight="bold">Attendance</text><text x="856" y="1146" font-size="20" >PK/FK pair:</text><text x="856" y="1175" font-size="20" >MemberID, SessionID</text><text x="856" y="1204" font-size="20" >Present (0 or 1)</text></g><g fill="none" stroke="#285747" stroke-width="2.5"><path d="M180 260 L180 390"/><g transform="translate(180 260) rotate(90)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(180 390) rotate(90)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-16 0L0 -12 M-16 0H0 M-16 0L0 12"/></g><path d="M320 480 L440 480"/><g transform="translate(320 480) rotate(0)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(440 480) rotate(0)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-16 0L0 -12 M-16 0H0 M-16 0L0 12"/></g><path d="M580 260 L580 390"/><g transform="translate(580 260) rotate(90)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(580 390) rotate(90)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-16 0L0 -12 M-16 0H0 M-16 0L0 12"/></g><path d="M980 260 L980 325 L655 325 L655 390"/><g transform="translate(980 260) rotate(90)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(655 390) rotate(90)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-16 0L0 -12 M-16 0H0 M-16 0L0 12"/></g><path d="M720 480 L840 480"/><g transform="translate(720 480) rotate(0)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(840 480) rotate(0)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-16 0L0 -12 M-16 0H0 M-16 0L0 12"/></g><path d="M980 790 L980 580"/><g transform="translate(980 790) rotate(-90)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(980 580) rotate(-90)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-16 0L0 -12 M-16 0H0 M-16 0L0 12"/></g><path d="M580 610 L580 790"/><g transform="translate(580 610) rotate(90)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(580 790) rotate(90)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-16 0L0 -12 M-16 0H0 M-16 0L0 12"/></g><path d="M320 870 L440 870"/><g transform="translate(320 870) rotate(0)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(440 870) rotate(0)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-16 0L0 -12 M-16 0H0 M-16 0L0 12"/></g><path d="M1120 530 L1190 530 L1190 1165 L1120 1165"/><g transform="translate(1120 530) rotate(0)"><path d="M10 -12V12 M20 -12V12"/></g><g transform="translate(1120 1165) rotate(180)"><circle cx="-31" cy="0" r="7" fill="#fcfbf7"/><path d="M-11 -12V12"/></g></g><text x="40" y="1320" font-size="23" >Legend: two bars = exactly one; circle + crow’s foot = zero or many;</text><text x="40" y="1354" font-size="23" >circle + bar = zero or one. Read every relationship in both directions.</text><text x="40" y="1388" font-size="23" >Attendance(MemberID, SessionID) jointly references the Booking pair.</text><text x="40" y="1422" font-size="20" >Original classroom model · Brett Sullivan and contributors · CC BY 4.0</text></g></svg>