<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="title desc"><title id="title">Two Ethernet LANs joined by a router</title><desc id="desc">Client and switch A connect to router interface A on LAN A; router interface B and switch B connect to server on LAN B. A switch forwards a local frame; routing replaces link addresses and decrements IPv4 TTL.</desc><rect width="880" height="320" rx="14" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193d33" text-anchor="middle"><text x="230" y="35" font-size="22" font-weight="bold">LAN A: 192.0.2.0/24</text><text x="650" y="35" font-size="22" font-weight="bold">LAN B: 198.51.100.0/24</text></g><path d="M170 145H220M350 145H385M495 145H530M660 145H710" stroke="#315b4d" stroke-width="3"/><rect x="25" y="90" width="145" height="110" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="97.5" y="145.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Client C</text><text x="97.5" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193d33">192.0.2.10</text><rect x="220" y="90" width="130" height="110" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="285.0" y="145.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Switch A</text><text x="285.0" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193d33">L2 forwarding</text><rect x="385" y="90" width="110" height="110" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="440.0" y="145.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Router R</text><text x="440.0" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193d33">L3 routing</text><rect x="530" y="90" width="130" height="110" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="595.0" y="145.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Switch B</text><text x="595.0" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193d33">L2 forwarding</text><rect x="710" y="90" width="145" height="110" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="782.5" y="145.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Server S</text><text x="782.5" y="168.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193d33">198.51.100.20</text><g font-family="Arial,sans-serif" fill="#193d33" text-anchor="middle" font-size="16"><text x="280" y="230">R interface A: 192.0.2.1 / MAC RA</text><text x="605" y="254">R interface B: 198.51.100.1 / MAC RB</text><text x="440" y="289">Synthetic documentation addresses; no NAT, fragmentation or VLAN tags in this trace.</text></g></svg>