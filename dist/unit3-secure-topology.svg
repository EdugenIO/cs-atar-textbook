<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><title>Segmented media-centre design</title><rect width="960" height="540" fill="#f5f7fb"/><g font-family="Arial" fill="#152b44"><text x="30" y="40" font-size="26">A logical design: four VLANs, one routed policy boundary</text><rect x="340" y="70" width="280" height="52" rx="10" fill="white" stroke="#426682" stroke-width="2"/><text x="355" y="102" font-size="18">Internet / access termination</text><rect x="340" y="150" width="280" height="70" rx="10" fill="white" stroke="#426682" stroke-width="2"/><text x="355" y="182" font-size="18">Edge router + firewall</text><text x="355" y="205" font-size="14">Routing, gateway interfaces, rules</text><rect x="340" y="270" width="280" height="55" rx="10" fill="white" stroke="#426682" stroke-width="2"/><text x="355" y="302" font-size="18">Managed layer 2 switch</text><g stroke="#426682" stroke-width="3" fill="none"><path d="M480 122 V150 M480 220 V270 M480 325 V355 H140 V385 M480 355 H820 V385 M360 355 V385 M600 355 V385"/></g><text x="500" y="250" font-size="16">802.1Q trunk</text><rect x="30" y="385" width="210" height="90" rx="10" fill="white" stroke="#426682" stroke-width="2"/><text x="45" y="417" font-size="18">10 Media</text><text x="42" y="442" font-size="15">192.168.50.0/26</text><text x="42" y="463" font-size="14">Gateway .1</text><rect x="270" y="385" width="210" height="90" rx="10" fill="white" stroke="#426682" stroke-width="2"/><text x="285" y="417" font-size="18">20 Staff</text><text x="282" y="442" font-size="15">192.168.50.64/27</text><text x="282" y="463" font-size="14">Gateway .65</text><rect x="510" y="385" width="210" height="90" rx="10" fill="white" stroke="#426682" stroke-width="2"/><text x="525" y="417" font-size="18">30 Devices</text><text x="522" y="442" font-size="15">192.168.50.96/28</text><text x="522" y="463" font-size="14">Gateway .97</text><rect x="750" y="385" width="210" height="90" rx="10" fill="white" stroke="#426682" stroke-width="2"/><text x="765" y="417" font-size="18">40 Visitors</text><text x="762" y="442" font-size="15">192.168.50.112/28</text><text x="762" y="463" font-size="14">Gateway .113</text><text x="30" y="505" font-size="16">Representative end devices: Media PCs; Staff PCs; printer .98; guest wireless clients.</text><text x="30" y="528" font-size="15">Logical links, not physical port counts. Concept symbols; final task uses Cisco conventions.</text></g></svg>