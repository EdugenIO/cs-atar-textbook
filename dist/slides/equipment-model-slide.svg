<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 500" role="img" aria-labelledby="title desc"><title id="title">Four-table equipment loan model</title><desc id="desc">Category to Equipment, Equipment to Loan, and Borrower to Loan: each parent permits zero or many children, and each child requires exactly one parent. Primary keys are underlined. Foreign keys are labelled.</desc><style>rect,circle{fill:#fcfbf7;stroke:#285747;stroke-width:2}path{fill:none;stroke:#285747;stroke-width:2}text{font-family:Arial,sans-serif;fill:#18322d}</style><rect x="4" y="4" width="400" height="128"/><text x="20" y="35" font-size="28" font-weight="bold">Category</text><path d="M4 48L404 48"/><text x="20" y="79" font-size="24" text-decoration="underline">CategoryID (PK)</text><text x="20" y="109" font-size="24">CategoryName</text><rect x="692" y="4" width="448" height="168"/><text x="708" y="35" font-size="28" font-weight="bold">Equipment</text><path d="M692 48L1140 48"/><text x="708" y="79" font-size="24" text-decoration="underline">EquipmentID (PK)</text><text x="708" y="109" font-size="24">EquipmentDescription</text><text x="708" y="139" font-size="24">CategoryID (FK)</text><rect x="4" y="274" width="400" height="128"/><text x="20" y="305" font-size="28" font-weight="bold">Borrower</text><path d="M4 318L404 318"/><text x="20" y="349" font-size="24" text-decoration="underline">BorrowerID (PK)</text><text x="20" y="379" font-size="24">BorrowerLabel</text><rect x="692" y="274" width="448" height="216"/><text x="708" y="305" font-size="28" font-weight="bold">Loan</text><path d="M692 318L1140 318"/><text x="708" y="349" font-size="24" text-decoration="underline">LoanID (PK)</text><text x="708" y="379" font-size="24">BorrowerID (FK)</text><text x="708" y="409" font-size="24">EquipmentID (FK)</text><text x="708" y="439" font-size="24">DueDate</text><text x="708" y="469" font-size="24">Returned</text><path d="M404 84L692 84"/><path d="M418 72L418 96"/><path d="M428 72L428 96"/><circle cx="657" cy="84" r="7"/><path d="M676 84L692 70"/><path d="M676 84L692 98"/><path d="M404 354L692 354"/><path d="M418 342L418 366"/><path d="M428 342L428 366"/><circle cx="657" cy="354" r="7"/><path d="M676 354L692 340"/><path d="M676 354L692 368"/><path d="M916 172L916 274"/><path d="M904 186L928 186"/><path d="M904 196L928 196"/><circle cx="916" cy="244" r="7"/><path d="M916 260L902 274"/><path d="M916 260L930 274"/><text x="442" y="67" font-size="22">classifies</text><text x="442" y="337" font-size="22">borrows</text><text x="938" y="230" font-size="22">loan history</text><text x="4" y="456" font-size="24">|| = exactly one</text><text x="4" y="486" font-size="24">Circle + crow’s foot = zero or many</text></svg>
