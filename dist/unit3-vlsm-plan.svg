<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title desc"><title id="title">Variable-length subnet plan inside192.168.50.0/24</title><desc id="desc">Media uses0..63, Staff64..95, Devices96..111, Visitors112..127;128..255 remains a contiguous /25 reserve. Subnets are aligned and non-overlapping.</desc><rect width="820" height="340" rx="14" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193d33"><text x="410" y="35" text-anchor="middle" font-size="23" font-weight="bold">One /24, four aligned subnets and a reserve</text><text x="410" y="60" text-anchor="middle" font-size="16">Full block ranges are shown, including network and broadcast.</text><rect x="26" y="85" width="192" height="65" fill="#cfe5d7" stroke="#315b4d"/><text x="122.0" y="125" text-anchor="middle" font-size="20">A</text><rect x="218" y="85" width="96" height="65" fill="#dce9ee" stroke="#315b4d"/><text x="266.0" y="125" text-anchor="middle" font-size="20">B</text><rect x="314" y="85" width="48" height="65" fill="#f4e7c5" stroke="#315b4d"/><text x="338.0" y="125" text-anchor="middle" font-size="20">C</text><rect x="362" y="85" width="48" height="65" fill="#eddbcf" stroke="#315b4d"/><text x="386.0" y="125" text-anchor="middle" font-size="20">D</text><rect x="410" y="85" width="384" height="65" fill="#e4e9e3" stroke="#315b4d"/><text x="602.0" y="125" text-anchor="middle" font-size="20">Reserve</text><text x="26" y="175" text-anchor="middle" font-size="15">0</text><text x="218" y="175" text-anchor="middle" font-size="15">64</text><text x="314" y="175" text-anchor="middle" font-size="15">96</text><text x="362" y="175" text-anchor="middle" font-size="15">112</text><text x="410" y="175" text-anchor="middle" font-size="15">128</text><text x="794" y="175" text-anchor="middle" font-size="15">256</text><text x="40" y="211" font-size="17">A Media: /26, .0–.63; 51 required, 62 usable</text><text x="40" y="239" font-size="17">B Staff: /27, .64–.95; 26 required, 30 usable</text><text x="40" y="267" font-size="17">C Devices: /28, .96–.111; 13 required, 14 usable</text><text x="40" y="295" font-size="17">D Visitors: /28, .112–.127; 7 required, 14 usable</text><text x="40" y="323" font-size="17">Reserve: 192.168.50.128/25; no assignment in this example</text></g></svg>