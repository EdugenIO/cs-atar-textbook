t-size="16">PK SessionID</text><text x="410" y="347" font-size="16">FK WorkshopID, InstructorID</text><text x="410" y="366" font-size="16">SessionDate, Capacity</text><rect x="765" y="275" width="280" height="120" rx="8" fill="white" stroke="#24475a" stroke-width="2"/><text x="780" y="302" font-size="21">Booking</text><text x="780" y="328" font-size="16">PK/FK MemberID, SessionID</text><text x="780" y="347" font-size="16">BookedOn</text><rect x="765" y="475" width="280" height="120" rx="8" fill="white" stroke="#24475a" stroke-width="2"/><text x="780" y="502" font-size="21">Attendance</text><text x="780" y="528" font-size="16">PK/FK pair -&gt; Booking pair</text><text x="780" y="547" font-size="16">Present (0/1)</text></g><g fill="none" stroke="#24475a" stroke-width="2.5"><path d="M165 185V335H395" marker-start="url(#one)" marker-end="url(#many)"/><path d="M535 185V275" marker-start="url(#one)" marker-end="url(#many)"/><path d="M905 185V275" marker-start="url(#one)" marker-end="url(#many)"/><path d="M675 335H765" marker-start="url(#one)" marker-end="url(#many)"/><path d="M905 395V475" marker-start="url(#one)" marker-end="url(#optional)"/></g><g font-family="Arial" fill="#18354d" font-size="16"><text x="25" y="610">Legend: two bars = exactly one; circle + crow’s foot = zero or many; circle + bar = zero or one.</text><text x="25" y="638">Each child points to its required parent. Attendance uses a joint foreign key; no row means unrecorded.</text></g></svg>