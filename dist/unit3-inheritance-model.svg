<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">Equipment inheritance hierarchy</title><desc id="desc">Camera and Projector inherit from Equipment. Hollow triangle arrows point to the superclass. Stock operations are inherited and preparation is overridden.</desc><rect width="760" height="350" rx="16" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193d33" stroke="#315b4d" stroke-width="2"><rect x="235" y="20" width="290" height="105" rx="8" fill="white"/><path d="M235 57H525"/><rect x="30" y="225" width="310" height="105" rx="8" fill="white"/><path d="M30 262H340"/><rect x="420" y="225" width="310" height="105" rx="8" fill="white"/><path d="M420 262H730"/><path d="M185 225V175H380V143M575 225V175H380" fill="none"/><path d="M380 125L370 143H390Z" fill="white"/></g><g font-family="Arial,sans-serif" fill="#193d33" text-anchor="middle"><text x="380" y="46" font-size="22" font-weight="bold">Equipment</text><text x="380" y="81" font-size="17">lend / return_units / available</text><text x="380" y="108" font-size="17">preparation()</text><text x="185" y="251" font-size="22" font-weight="bold">Camera</text><text x="185" y="286" font-size="17">charge / set_charge()</text><text x="185" y="313" font-size="17">overrides preparation()</text><text x="575" y="251" font-size="22" font-weight="bold">Projector</text><text x="575" y="286" font-size="17">lamp_hours / add_usage()</text><text x="575" y="313" font-size="17">overrides preparation()</text><text x="380" y="205" font-size="16">inherits from — arrow points to superclass</text></g></svg>