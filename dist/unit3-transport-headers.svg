<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" role="img" aria-labelledby="title desc"><title id="title">Simplified minimum TCP and UDP headers</title><desc id="desc">Each header row represents 32 bits. TCP has five rows, twenty bytes; UDP has two rows, eight bytes. TCP options are omitted.</desc><rect width="800" height="455" rx="14" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193d33" text-anchor="middle"><text x="210" y="35" font-size="22" font-weight="bold">TCP minimum: 20 bytes</text><text x="605" y="35" font-size="22" font-weight="bold">UDP header: 8 bytes</text><text x="210" y="65" font-size="15">Each row = 32 bits (4 bytes)</text><text x="605" y="65" font-size="15">Each row = 32 bits (4 bytes)</text></g><rect x="30" y="80" width="180" height="45" fill="white" stroke="#315b4d"/><text x="120.0" y="108" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Source port (16)</text><rect x="210" y="80" width="180" height="45" fill="white" stroke="#315b4d"/><text x="300.0" y="108" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Destination port (16)</text><rect x="425" y="80" width="180" height="45" fill="white" stroke="#315b4d"/><text x="515.0" y="108" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Source port (16)</text><rect x="605" y="80" width="180" height="45" fill="white" stroke="#315b4d"/><text x="695.0" y="108" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Destination port (16)</text><rect x="30" y="125" width="360" height="45" fill="white" stroke="#315b4d"/><text x="210.0" y="153" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Sequence number (32)</text><rect x="30" y="170" width="360" height="45" fill="white" stroke="#315b4d"/><text x="210.0" y="198" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Acknowledgement number (32)</text><rect x="30" y="215" width="180" height="45" fill="white" stroke="#315b4d"/><text x="120.0" y="243" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Offset / flags / reserved</text><rect x="210" y="215" width="180" height="45" fill="white" stroke="#315b4d"/><text x="300.0" y="243" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Window (16)</text><rect x="30" y="260" width="180" height="45" fill="white" stroke="#315b4d"/><text x="120.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Checksum (16)</text><rect x="210" y="260" width="180" height="45" fill="white" stroke="#315b4d"/><text x="300.0" y="288" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Urgent pointer (16)</text><rect x="425" y="125" width="180" height="45" fill="white" stroke="#315b4d"/><text x="515.0" y="153" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Length (16)</text><rect x="605" y="125" width="180" height="45" fill="white" stroke="#315b4d"/><text x="695.0" y="153" font-family="Arial,sans-serif" font-size="15" fill="#193d33" text-anchor="middle">Checksum (16)</text><g font-family="Arial,sans-serif" fill="#193d33" font-size="16" text-anchor="middle"><text x="210" y="340">TCP options/padding can extend the header.</text><text x="605" y="210">Length includes header + UDP payload.</text><text x="400" y="395">Transport headers sit inside an IP packet; they do not replace its IP addresses.</text><text x="400" y="425">Schematic fields only; no TCP options, packet bytes or checksum computation shown.</text></g></svg>