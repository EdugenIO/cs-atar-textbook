<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">IPv4 /27 boundary in the final octet</title><desc id="desc">For192.168.50.70/27, the first24 bits and first3 bits of the last octet identify the network. Address last octet01000110 AND mask11100000 gives network01000000 or64. Five host bits give32 addresses.</desc><rect width="820" height="330" rx="14" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193d33"><text x="410" y="32" text-anchor="middle" font-size="23" font-weight="bold">192.168.50.70/27: 27 network bits, 5 host bits</text><text x="410" y="59" text-anchor="middle" font-size="16">The first three octets supply 24 network bits; inspect the final octet below.</text><text x="30" y="115" font-size="18">Address 70</text><rect x="210" y="82" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="240" y="114" text-anchor="middle" font-size="22">0</text><rect x="278" y="82" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="308" y="114" text-anchor="middle" font-size="22">1</text><rect x="346" y="82" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="376" y="114" text-anchor="middle" font-size="22">0</text><rect x="414" y="82" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="444" y="114" text-anchor="middle" font-size="22">0</text><rect x="482" y="82" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="512" y="114" text-anchor="middle" font-size="22">0</text><rect x="550" y="82" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="580" y="114" text-anchor="middle" font-size="22">1</text><rect x="618" y="82" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="648" y="114" text-anchor="middle" font-size="22">1</text><rect x="686" y="82" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="716" y="114" text-anchor="middle" font-size="22">0</text><text x="30" y="177" font-size="18">Mask 224</text><rect x="210" y="144" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="240" y="176" text-anchor="middle" font-size="22">1</text><rect x="278" y="144" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="308" y="176" text-anchor="middle" font-size="22">1</text><rect x="346" y="144" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="376" y="176" text-anchor="middle" font-size="22">1</text><rect x="414" y="144" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="444" y="176" text-anchor="middle" font-size="22">0</text><rect x="482" y="144" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="512" y="176" text-anchor="middle" font-size="22">0</text><rect x="550" y="144" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="580" y="176" text-anchor="middle" font-size="22">0</text><rect x="618" y="144" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="648" y="176" text-anchor="middle" font-size="22">0</text><rect x="686" y="144" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="716" y="176" text-anchor="middle" font-size="22">0</text><text x="30" y="239" font-size="18">AND → 64</text><rect x="210" y="206" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="240" y="238" text-anchor="middle" font-size="22">0</text><rect x="278" y="206" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="308" y="238" text-anchor="middle" font-size="22">1</text><rect x="346" y="206" width="60" height="48" fill="#cfe5d7" stroke="#315b4d"/><text x="376" y="238" text-anchor="middle" font-size="22">0</text><rect x="414" y="206" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="444" y="238" text-anchor="middle" font-size="22">0</text><rect x="482" y="206" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="512" y="238" text-anchor="middle" font-size="22">0</text><rect x="550" y="206" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="580" y="238" text-anchor="middle" font-size="22">0</text><rect x="618" y="206" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="648" y="238" text-anchor="middle" font-size="22">0</text><rect x="686" y="206" width="60" height="48" fill="#f4e7c5" stroke="#315b4d"/><text x="716" y="238" text-anchor="middle" font-size="22">0</text><text x="310" y="293" text-anchor="middle" font-size="16">3 more network bits</text><text x="650" y="293" text-anchor="middle" font-size="16">5 host bits: 32 addresses</text></g></svg>