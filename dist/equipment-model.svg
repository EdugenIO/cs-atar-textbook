<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
<title id="title">Equipment loan model in crow's-foot notation</title><desc id="desc">A Category has zero or many Equipment items; each Equipment has exactly one Category. A Borrower has zero or many Loans; each Loan has exactly one Borrower. Equipment has zero or many Loans over time; each Loan references exactly one item.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18322d;font-size:16px}.heading{font-weight:bold;font-size:20px}.box{fill:#fcfbf7;stroke:#285747;stroke-width:2}.line{fill:none;stroke:#285747;stroke-width:2}.note{font-size:13px}circle.line{fill:#fcfbf7}circle.line{fill:#fcfbf7}</style>
<rect class="box" x="20" y="20" width="240" height="140" rx="6"/><text class="heading" x="38" y="51">Category</text><path class="line" d="M20 67H260"/><text x="38" y="96" text-decoration="underline">CategoryID (PK)</text><text x="38" y="128">CategoryName</text>
<rect class="box" x="400" y="20" width="300" height="180" rx="6"/><text class="heading" x="418" y="51">Equipment</text><path class="line" d="M400 67H700"/><text x="418" y="96" text-decoration="underline">EquipmentID (PK)</text><text x="418" y="128">EquipmentDescription</text><text x="418" y="160">CategoryID (FK)</text>
<path class="line" d="M260 105H400 M274 95V115 M282 95V115 M383 105L398 91 M383 105L398 119"/><circle class="line" cx="365" cy="105" r="6"/>
<text class="note" x="285" y="86">classifies</text>
<rect class="box" x="20" y="315" width="240" height="145" rx="6"/><text class="heading" x="38" y="346">Borrower</text><path class="line" d="M20 362H260"/><text x="38" y="391" text-decoration="underline">BorrowerID (PK)</text><text x="38" y="423">BorrowerLabel</text>
<rect class="box" x="400" y="300" width="300" height="230" rx="6"/><text class="heading" x="418" y="331">Loan</text><path class="line" d="M400 347H700"/><text x="418" y="376" text-decoration="underline">LoanID (PK)</text><text x="418" y="408">BorrowerID (FK)</text><text x="418" y="440">EquipmentID (FK)</text><text x="418" y="472">DueDate</text><text x="418" y="504">Returned</text>
<path class="line" d="M260 403H400 M274 393V413 M282 393V413 M383 403L398 389 M383 403L398 417"/><circle class="line" cx="365" cy="403" r="6"/><text class="note" x="285" y="382">borrows</text>
<path class="line" d="M550 200V300 M540 214H560 M540 222H560 M550 283L536 298 M550 283L564 298"/><circle class="line" cx="550" cy="265" r="6"/><text class="note" x="570" y="251">loan history</text>
<text class="note" x="20" y="552">PK underlined; FK labelled. Circle = zero; bar = one; crow's foot = many.</text></svg>