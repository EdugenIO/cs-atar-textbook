  <text x="60" y="298" font-family="Georgia,serif" font-size="76" fill="#18322D">Science ATAR</text>
  <text x="64" y="365" font-family="Arial,sans-serif" font-size="28" fill="#285747">A free, open textbook for WA teachers.</text>
  <rect x="64" y="408" width="168" height="47" rx="5" fill="#285747"/>
  <text x="148" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">UNITS 1–4</text>
  <text x="64" y="520" font-family="Arial,sans-serif" font-size="25" fill="#18322D">Read. Teach. Share. Adapt.</text>
  <text x="64" y="568" font-family="Arial,sans-serif" font-size="19" fill="#52645B">Python examples · Classroom activities · Teacher resources</text>
