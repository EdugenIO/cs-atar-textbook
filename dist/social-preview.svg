<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Computer Science ATAR: a free, open classroom textbook</title>
  <desc id="desc">Green and cream textbook artwork for WA Units 1–4. Free to use, share and adapt with attribution.</desc>
  <rect width="1200" height="630" fill="#FCFBF7"/>
  <path d="M780 0H1200V630H780Z" fill="#285747"/>
