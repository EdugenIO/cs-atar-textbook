<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-labelledby="title desc"><title id="title">OSI and four-layer DoD TCP/IP mapping</title><desc id="desc">OSI application, presentation and session map broadly to TCP/IP application; transport to transport; network to internet; data link and physical to the network/link layer.</desc><rect width="800" height="510" rx="14" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193d33" text-anchor="middle"><text x="200" y="34" font-size="23" font-weight="bold">OSI reference model</text><text x="600" y="34" font-size="23" font-weight="bold">DoD TCP/IP model</text></g><rect x="40" y="55" width="320" height="50" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="200.0" y="86.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">7 Application</text><rect x="40" y="114" width="320" height="50" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="200.0" y="145.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">6 Presentation</text><rect x="40" y="173" width="320" height="50" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="200.0" y="204.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">5 Session</text><rect x="40" y="232" width="320" height="50" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="200.0" y="263.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">4 Transport</text><rect x="40" y="291" width="320" height="50" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="200.0" y="322.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">3 Network</text><rect x="40" y="350" width="320" height="50" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="200.0" y="381.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">2 Data link</text><rect x="40" y="409" width="320" height="50" rx="6" fill="white" stroke="#315b4d" stroke-width="1.5"/><text x="200.0" y="440.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">1 Physical</text><rect x="440" y="55" width="320" height="168" rx="6" fill="#e1eee5" stroke="#315b4d" stroke-width="1.5"/><text x="600.0" y="139.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Application</text><text x="600.0" y="162.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193d33">OSI 5–7 functions</text><rect x="440" y="232" width="320" height="50" rx="6" fill="#e1eee5" stroke="#315b4d" stroke-width="1.5"/><text x="600.0" y="263.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Transport</text><rect x="440" y="291" width="320" height="50" rx="6" fill="#e1eee5" stroke="#315b4d" stroke-width="1.5"/><text x="600.0" y="322.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Internet</text><rect x="440" y="350" width="320" height="109" rx="6" fill="#e1eee5" stroke="#315b4d" stroke-width="1.5"/><text x="600.0" y="404.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193d33">Network / link</text><text x="600.0" y="427.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193d33">OSI 1–2 functions</text><g stroke="#315b4d" stroke-width="2" fill="none"><path d="M360 139H440M360 257H440M360 316H440M360 404H440"/></g><text x="400" y="489" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193d33">Broad teaching correspondence; actual protocol boundaries are not exact.</text></svg>