<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 650" role="img" aria-labelledby="title desc"><title id="title">Six-table equipment model extension</title><desc id="desc">Category and Supplier each have zero or many Equipment; Equipment and Borrower each have zero or many Loan; Equipment has zero or many Inspection. Every child has exactly one corresponding parent. This is a conceptual extension, not the starter database.</desc><style>text{font-family:Arial;fill:#18322d;font-size:17px}.line{stroke:#285747;stroke-width:2;fill:none}.box{fill:#fcfbf7;stroke:#285747;stroke-width:2}</style><rect class="box" x="30" y="30" width="270" height="180" rx="6"/><text x="45" y="60" font-weight="bold">Category</text><path class="line" d="M30 73h270"/><text x="45" y="105" text-decoration="underline">CategoryID (PK)</text><text x="45" y="134">CategoryName</text><rect class="box" x="370" y="30" width="270" height="180" rx="6"/><text x="385" y="60" font-weight="bold">Equipment</text><path class="line" d="M370 73h270"/><text x="385" y="105" text-decoration="underline">EquipmentID (PK)</text><text x="385" y="134">CategoryID (FK)</text><text x="385" y="163">SupplierID (FK)</text><rect class="box" x="750" y="30" width="270" height="180" rx="6"/><text x="765" y="60" font-weight="bold">Supplier</text><path class="line" d="M750 73h270"/><text x="765" y="105" text-decoration="underline">SupplierID (PK)</text><text x="765" y="134">SupplierLabel</text><rect class="box" x="30" y="380" width="270" height="180" rx="6"/><text x="45" y="410" font-weight="bold">Borrower</text><path class="line" d="M30 423h270"/><text x="45" y="455" text-decoration="underline">BorrowerID (PK)</text><text x="45" y="484">BorrowerLabel</text><rect class="box" x="370" y="380" width="270" height="180" rx="6"/><text x="385" y="410" font-weight="bold">Loan</text><path class="line" d="M370 423h270"/><text x="385" y="455" text-decoration="underline">LoanID (PK)</text><text x="385" y="484">BorrowerID (FK)</text><text x