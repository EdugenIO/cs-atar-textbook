name: Publish textbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Regression checks
        run: |
          python scripts/build-extended-packs.py
          python scripts/build-sql-pathway.py
          node scripts/build-resource-hub.mjs
          node scripts/build-revision.mjs
          node scripts/build-teacher-planning.mjs
          node --test tests/*.test.mjs
          python tests/lesson-slides-package.test.py
          python tests/game-project-packages.test.py
          python tests/project-alignment.test.py
          python tests/project-trial.test.py
          python tests/curriculum-map.test.py
          python tests/foundations-pack.test.py
          python tests/extended-packs.test.py
          python tests/sql-pathway.test.py
          python -m pip install pygame==2.6.1
          python tests/pygame-bridge.test.py
          python tests/teaching-depth-examples.test.py
      - name: Version runtime assets
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
