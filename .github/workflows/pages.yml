name: Publish textbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Regression checks
        run: |
          python scripts/build-editorial-review.py
          python scripts/build-provision-review.py
          python scripts/build-curriculum-map.py
          python scripts/build-lesson-checks.py
          node scripts/build-student-journeys.mjs
          node scripts/build-lesson-routes.mjs
          node scripts/build-model-lesson.mjs
          python scripts/build-extended-packs.py
          python scripts/build-sql-pathway.py
          python scripts/build-programming-reference.py
          python tests/programming-reference.test.py
          node scripts/build-resource-hub.mjs
          node scripts/build-revision.mjs
          node scripts/build-teacher-planning.mjs
          python scripts/build-technical-review.py
          node scripts/build-resource-status.mjs
          node scripts/build-reading-shell.mjs
          node scripts/build-offline-readers.mjs
          python scripts/build-offline-library.py
          node --test tests/*.test.mjs
          python tests/offline-library.test.py
          python tests/lesson-slides-package.test.py
          python tests/game-project-packages.test.py
          python tests/project-alignment.test.py
          python tests/project-trial.test.py
          python tests/curriculum-map.test.py
          python tests/curriculum-provision.test.py
          python tests/foundations-pack.test.py
          python tests/extended-packs.test.py
          python tests/sql-pathway.test.py
          python tests/technical-accuracy.test.py
          python -m pip install pygame==2.6.1
          python tests/pygame-bridge.test.py
          python tests/teaching-depth-examples.test.py
      - name: Version runtime assets
        run: node scripts/prepare-pages.mjs
      - name: Package offline library with versioned assets
        run: |
          python scripts/build-offline-library.py
          python tests/offline-library.test.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install browser acceptance tools
        timeout-minutes: 8
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Browser and accessibility acceptance
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-acceptance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
